name: Verify the experiment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Build the native reader and desktop icon
        run: zsh build.sh --universal
      - name: Verify both readers and malformed fixtures
        run: python3 test_experiment.py
      - name: Verify the generated website matches its source
        run: |
          python3 build_site.py
          git diff --exit-code -- docs
      - name: Check the app signature and architectures
        run: |
          codesign --verify --deep --strict 'output/Else Experiment.app'
          python3 -c "import subprocess; assert set(subprocess.check_output(['xcrun', 'lipo', '-archs', 'output/Else Experiment.app/Contents/MacOS/ElseExperiment'], text=True).split()) == {'arm64', 'x86_64'}"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify local reading, creation, editing, exact downloads and zero upload requests
        run: npm run test:browser
      - name: Verify Cloudflare publishes only the static website
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.152.0 deploy --dry-run
