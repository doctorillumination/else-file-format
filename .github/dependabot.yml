version: 2
updates:
  - package-ecosystem: "npm"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
